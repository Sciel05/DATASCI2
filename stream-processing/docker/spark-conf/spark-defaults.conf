# The pyspark container points SPARK_CONF_DIR here (docker-compose.yml), so
# every spark-submit there (detector, parity_check, evaluation) gets these
# unless it sets its own. The Docker VM also hosts Kafka and three Cassandra
# nodes: local[*] on a 16-core machine started 16 Python workers and starved
# the VM until Cassandra nodes were restarted.
spark.master                  local[4]
spark.driver.memory           1g
# one task per Kafka partition instead of Spark's default 200 per micro-batch
spark.sql.shuffle.partitions  8
