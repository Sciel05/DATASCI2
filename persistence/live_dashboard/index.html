<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surveillance Live</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0b0f17; --panel: #121826; --panel-2: #172033; --line: #232d42;
    --text: #e6ebf5; --muted: #8b95a9; --up: #22c55e; --down: #ef4444;
    --shock: #f43f5e; --wash: #f59e0b; --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .num { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-variant-numeric: tabular-nums; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .01em; }
  header .sub { color: var(--muted); font-size: 12px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--up); box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
  .dot.idle { background: var(--wash); }
  .dot.down { background: var(--down); }
  main { padding: 16px 20px 24px; display: grid; gap: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
          cursor: pointer; text-align: left; color: inherit; font: inherit; transition: border-color .15s; }
  .tile:hover { border-color: #33415c; }
  .tile.active { border-color: var(--accent); background: var(--panel-2); }
  .tile .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .tile .sym { font-weight: 650; }
  .tile .price { font-size: 15px; }
  .tile .chg { font-size: 12px; }
  .tile .flags { margin-top: 6px; font-size: 12px; color: var(--muted); display: flex; gap: 10px; }
  .up { color: var(--up); } .down { color: var(--down); }
  .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
  .body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; }
  @media (max-width: 960px) { .body { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
  .panel-head { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .panel-head h2 { font-size: 13px; margin: 0; font-weight: 600; }
  .controls { margin-left: auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { background: transparent; border: 0; color: var(--muted); padding: 4px 9px; font: 12px ui-monospace, Consolas, monospace; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--panel-2); color: var(--text); }
  .golive { background: var(--panel-2); color: var(--accent); border: 1px solid var(--line); border-radius: 6px;
            padding: 3px 9px; font-size: 12px; cursor: pointer; }
  .feed tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
  .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  #chart { height: 520px; position: relative; }
  .empty { position: absolute; inset: 0; display: none; place-items: center; color: var(--muted); text-align: center; padding: 24px; z-index: 2; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); padding: 8px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .feed { max-height: 590px; overflow-y: auto; }
  .feed table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .feed th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 500; text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  .feed td { padding: 6px 10px; border-bottom: 1px solid #1a2233; white-space: nowrap; }
  .feed td.r { text-align: right; }
  .feed tr { cursor: pointer; }
  .feed tr:hover td { background: #161e2e; }
  .feed tr.new td { animation: arrive 1.6s ease-out; }
  @keyframes arrive { from { background: rgba(56,189,248,.18); } to { background: transparent; } }
  .pill { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .pill.price_shock { background: rgba(244,63,94,.16); color: var(--shock); }
  .pill.wash_trade { background: rgba(245,158,11,.16); color: var(--wash); }
  .feed .none { color: var(--muted); padding: 16px 12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Market Surveillance · Live</h1>
    <div class="sub">Kafka → Spark detector → Cassandra</div>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="status">Connecting…</span></div>
</header>

<main>
  <section class="tiles" id="tiles" aria-label="Tickers"></section>

  <section class="body">
    <div class="panel">
      <div class="panel-head">
        <h2 id="chart-title">—</h2>
        <button class="golive" id="golive" hidden>Back to live ▸</button>
        <div class="controls">
          <span class="label">Candle</span>
          <div class="seg" id="bucket-seg"></div>
          <span class="label">Window</span>
          <div class="seg" id="window-seg"></div>
        </div>
      </div>
      <div id="chart"><div class="empty" id="empty"></div></div>
      <div class="legend">
        <span><span class="swatch" style="background:var(--shock)"></span>price shock</span>
        <span><span class="swatch" style="background:var(--wash)"></span>wash trade</span>
        <span>markers: flagged ticks per candle · times in your local zone</span>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Anomaly feed</h2><span class="label" id="feed-count"></span>
        <div class="controls"><div class="seg" id="scope-seg"></div></div></div>
      <div class="feed">
        <table>
          <thead><tr><th>Time</th><th>Ticker</th><th>Type</th><th class="r">Risk</th><th>Signals</th></tr></thead>
          <tbody id="feed"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script>
const TICKERS = ["AAPL", "MSFT", "GOOGL", "TSLA", "NVDA"];
const BUCKETS = [[1, "1s"], [5, "5s"], [15, "15s"], [30, "30s"], [60, "1m"]];
const WINDOWS = [[5, "5m"], [15, "15m"], [30, "30m"], [60, "1h"]];
const COLORS = { price_shock: "#f43f5e", wash_trade: "#f59e0b" };
const TZ_SHIFT = -new Date().getTimezoneOffset() * 60;  // the chart draws times as UTC

const state = {
  ticker: localGet("ticker", "NVDA"),
  bucket: +localGet("bucket", 5),
  windowMin: +localGet("window", 15),
  lastCandle: null,         // UTC epoch s of the newest candle drawn
  anomalies: new Map(),     // key -> anomaly, all tickers
  anomalySince: null,
  feedKeys: new Set(),
  feedScope: localGet("scope", "ticker"),   // "ticker": selected ticker only, "all"
  barTimes: new Set(),      // UTC candle times on the chart; a marker needs its candle
  generation: 0,
  anomalyGen: 0,            // bumps on ticker/bucket/window change; stale responses are dropped
};

function localGet(k, d) { try { return localStorage.getItem("surv." + k) ?? d; } catch { return d; } }
function localSet(k, v) { try { localStorage.setItem("surv." + k, v); } catch {} }
const nowS = () => Date.now() / 1000;
const fmtTime = t => new Date(t * 1000).toLocaleTimeString([], { hour12: false });
const fmtPrice = p => p == null ? "—" : p.toFixed(p < 100 ? 3 : 2);
const akey = a => `${a.ticker}|${a.time}|${a.incident ?? ""}`;

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  const body = await r.json();
  if (!r.ok) throw new Error(body.error || r.status);
  return body;
}

// ── status ────────────────────────────────────────────────────────────
let lastOk = 0, lastTick = 0, lastError = null;
function renderStatus() {
  const dot = document.getElementById("dot"), s = document.getElementById("status");
  if (lastError && nowS() - lastOk > 5) {
    dot.className = "dot down"; s.textContent = "Cassandra unreachable — retrying";
  } else if (lastTick && nowS() - lastTick < 15) {
    dot.className = "dot live"; s.textContent = `Live · last tick ${fmtTime(lastTick)}`;
  } else {
    dot.className = "dot idle";
    s.textContent = lastTick ? `No new ticks since ${fmtTime(lastTick)}` : "Waiting for data";
  }
}
setInterval(renderStatus, 1000);

// ── chart ─────────────────────────────────────────────────────────────
const chartEl = document.getElementById("chart");
const chart = LightweightCharts.createChart(chartEl, {
  autoSize: true,
  layout: { background: { color: "#121826" }, textColor: "#8b95a9", fontSize: 11 },
  grid: { vertLines: { color: "#1a2233" }, horzLines: { color: "#1a2233" } },
  rightPriceScale: { borderColor: "#232d42" },
  timeScale: { borderColor: "#232d42", timeVisible: true, secondsVisible: true, rightOffset: 4 },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
});
const candles = chart.addCandlestickSeries({
  upColor: "#22c55e", downColor: "#ef4444", borderVisible: false,
  wickUpColor: "#22c55e", wickDownColor: "#ef4444",
});
const volume = chart.addHistogramSeries({ priceScaleId: "", priceFormat: { type: "volume" } });
volume.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });

const toBar = c => ({ time: c.time + TZ_SHIFT, open: c.open, high: c.high, low: c.low, close: c.close });
const toVol = c => ({ time: c.time + TZ_SHIFT, value: c.volume,
                      color: c.close >= c.open ? "rgba(34,197,94,.35)" : "rgba(239,68,68,.35)" });

function showEmpty(msg) {
  const e = document.getElementById("empty");
  e.style.display = msg ? "grid" : "none";
  e.textContent = msg || "";
}

async function loadChart() {
  const gen = ++state.generation;
  document.getElementById("chart-title").textContent = `${state.ticker} · ${label(BUCKETS, state.bucket)} candles`;
  const since = nowS() - state.windowMin * 60;
  try {
    const { candles: cs } = await getJSON(`/api/candles?ticker=${state.ticker}&bucket=${state.bucket}&since=${since}`);
    if (gen !== state.generation) return;
    candles.setData(cs.map(toBar));
    volume.setData(cs.map(toVol));
    state.barTimes = new Set(cs.map(c => c.time));
    state.lastCandle = cs.length ? cs[cs.length - 1].time : null;
    showEmpty(cs.length ? "" : `No ticks for ${state.ticker} in the last ${state.windowMin} minutes. Start the producer with --restamp-now to stream live data.`);
    chart.timeScale().scrollToRealTime();
    renderMarkers();
    lastOk = nowS(); lastError = null;
  } catch (e) { lastError = e; }
}

// Only candles from the newest bucket onward: the last one is updated in
// place, new ones are appended. Nothing is redrawn.
async function pollChart() {
  const gen = state.generation;
  const since = state.lastCandle ?? nowS() - state.windowMin * 60;
  try {
    const { candles: cs } = await getJSON(`/api/candles?ticker=${state.ticker}&bucket=${state.bucket}&since=${since}`);
    if (gen !== state.generation) return;
    let newBar = false;
    for (const c of cs) {
      if (state.lastCandle !== null && c.time < state.lastCandle) continue;
      candles.update(toBar(c));
      volume.update(toVol(c));
      if (!state.barTimes.has(c.time)) { state.barTimes.add(c.time); newBar = true; }
      state.lastCandle = c.time;
    }
    if (cs.length) showEmpty("");
    // flags that arrived before their candle get their marker now
    if (newBar) renderMarkers();
    lastOk = nowS(); lastError = null;
  } catch (e) { lastError = e; }
}

function renderMarkers() {
  const perCandle = new Map();
  for (const a of state.anomalies.values()) {
    if (a.ticker !== state.ticker) continue;
    const t = Math.floor(a.time / state.bucket) * state.bucket;
    if (!state.barTimes.has(t)) continue;  // drawn once its candle arrives
    const m = perCandle.get(t) || { price_shock: 0, wash_trade: 0 };
    m[a.type] = (m[a.type] || 0) + 1;
    perCandle.set(t, m);
  }
  const markers = [];
  for (const [t, m] of [...perCandle.entries()].sort((a, b) => a[0] - b[0])) {
    if (m.price_shock) markers.push({ time: t + TZ_SHIFT, position: "aboveBar", shape: "arrowDown",
                                      color: COLORS.price_shock, text: m.price_shock > 1 ? String(m.price_shock) : "" });
    if (m.wash_trade) markers.push({ time: t + TZ_SHIFT, position: "belowBar", shape: "arrowUp",
                                     color: COLORS.wash_trade, text: m.wash_trade > 1 ? String(m.wash_trade) : "" });
  }
  candles.setMarkers(markers);
}

// ── anomalies ─────────────────────────────────────────────────────────
async function pollAnomalies() {
  // re-read a few seconds back: rows can land slightly out of order
  const gen = state.anomalyGen;
  const since = state.anomalySince ?? nowS() - state.windowMin * 60;
  try {
    const { anomalies } = await getJSON(`/api/anomalies?since=${since - 10}&limit=5000`);
    if (gen !== state.anomalyGen) return;
    let added = false;
    for (const a of anomalies) {
      const k = akey(a);
      if (!state.anomalies.has(k)) { state.anomalies.set(k, a); added = true; }
      if (state.anomalySince === null || a.time > state.anomalySince) state.anomalySince = a.time;
    }
    if (state.anomalySince === null) state.anomalySince = nowS() - 60;
    const cutoff = nowS() - state.windowMin * 60;
    let expired = false;
    for (const [k, a] of state.anomalies) if (a.time < cutoff) { state.anomalies.delete(k); expired = true; }
    if (added || expired) { renderMarkers(); renderFeed(); }
    lastOk = nowS(); lastError = null;
  } catch (e) { lastError = e; }
}

function renderFeed() {
  const scoped = [...state.anomalies.values()]
    .filter(a => state.feedScope === "all" || a.ticker === state.ticker)
    .sort((a, b) => b.time - a.time);
  const rows = scoped.slice(0, 150);
  const body = document.getElementById("feed");
  const firstLoad = state.feedKeys.size === 0;
  body.replaceChildren(...rows.map(a => {
    const tr = document.createElement("tr");
    const k = akey(a);
    if (!firstLoad && !state.feedKeys.has(k)) tr.classList.add("new");
    if (a.ticker === state.ticker) tr.classList.add("sel");
    tr.innerHTML = `<td class="num">${fmtTime(a.time)}</td><td>${a.ticker}</td>`
      + `<td><span class="pill ${a.type}">${a.type === "price_shock" ? "shock" : "wash"}</span></td>`
      + `<td class="r num">${a.risk == null ? "—" : a.risk.toFixed(2)}</td>`
      + `<td class="num" style="color:var(--muted)">${a.signals ?? ""}</td>`;
    tr.title = `price ${fmtPrice(a.price)} · volume ${a.volume} · z ${a.zscore?.toFixed?.(2) ?? "—"} · incident ${a.incident ?? "—"}`;
    tr.onclick = () => focusAnomaly(a);
    return tr;
  }));
  state.feedKeys = new Set(rows.map(akey));
  const who = state.feedScope === "all" ? "all tickers" : state.ticker;
  if (!rows.length) body.innerHTML = `<tr><td colspan="5" class="none">No anomalies for ${who} in the last ${state.windowMin}m.</td></tr>`;
  document.getElementById("feed-count").textContent =
    `${scoped.length} · ${who} · ${state.windowMin}m` + (scoped.length > rows.length ? ` (newest ${rows.length})` : "");
}

// ── summary tiles ─────────────────────────────────────────────────────
const tileEls = {};
function buildTiles() {
  const wrap = document.getElementById("tiles");
  for (const t of TICKERS) {
    const b = document.createElement("button");
    b.className = "tile";
    b.innerHTML = `<div class="row"><span class="sym">${t}</span><span class="price num">—</span></div>`
      + `<div class="row"><span class="label">${state.windowMin}m</span><span class="chg num">—</span></div>`
      + `<div class="flags"><span><span class="swatch" style="background:var(--shock)"></span><span class="n-shock num">0</span></span>`
      + `<span><span class="swatch" style="background:var(--wash)"></span><span class="n-wash num">0</span></span></div>`;
    b.onclick = () => selectTicker(t);
    wrap.appendChild(b);
    tileEls[t] = b;
  }
  markActiveTile();
}
function markActiveTile() { for (const t of TICKERS) tileEls[t].classList.toggle("active", t === state.ticker); }

async function pollSummary() {
  try {
    const { tickers } = await getJSON(`/api/summary?minutes=${state.windowMin}`);
    for (const s of tickers) {
      const el = tileEls[s.ticker]; if (!el) continue;
      el.querySelector(".price").textContent = fmtPrice(s.price);
      const chg = el.querySelector(".chg");
      if (s.price != null && s.window_open) {
        const pct = (s.price - s.window_open) / s.window_open * 100;
        chg.textContent = `${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%`;
        chg.className = "chg num " + (pct >= 0 ? "up" : "down");
      } else { chg.textContent = "—"; chg.className = "chg num"; }
      el.querySelector(".label").textContent = `${state.windowMin}m`;
      el.querySelector(".n-shock").textContent = s.anomalies.price_shock || 0;
      el.querySelector(".n-wash").textContent = s.anomalies.wash_trade || 0;
      if (s.last_tick) lastTick = Math.max(lastTick, s.last_tick);
    }
    lastOk = nowS(); lastError = null;
  } catch (e) { lastError = e; }
}

// ── controls ──────────────────────────────────────────────────────────
function label(list, v) { return (list.find(([x]) => x === v) || [, v])[1]; }
function buildSeg(id, list, get, set) {
  const seg = document.getElementById(id);
  for (const [v, text] of list) {
    const b = document.createElement("button");
    b.textContent = text;
    b.onclick = () => { set(v); render(); };
    seg.appendChild(b);
  }
  const render = () => [...seg.children].forEach((b, i) => b.classList.toggle("on", list[i][0] === get()));
  render();
}
function selectTicker(t) {
  if (t === state.ticker) return Promise.resolve();
  state.ticker = t; localSet("ticker", t);
  markActiveTile(); renderFeed();
  return loadChart();
}

// Centre the chart on a flagged tick; "Back to live" resumes following.
async function focusAnomaly(a) {
  await selectTicker(a.ticker);
  const t = Math.floor(a.time / state.bucket) * state.bucket + TZ_SHIFT;
  const half = Math.max(30 * state.bucket, 60);
  chart.timeScale().setVisibleRange({ from: t - half, to: t + half });
  chart.setCrosshairPosition(a.price, t, candles);
}
const goLive = document.getElementById("golive");
goLive.onclick = () => chart.timeScale().scrollToRealTime();
chart.timeScale().subscribeVisibleLogicalRangeChange(r => {
  goLive.hidden = !r || r.to >= candles.data().length - 1;
});

// A window change resets the anomaly set, so tiles, chart and feed cover the same span.
function resetAnomalies() {
  state.anomalyGen++;
  state.anomalies.clear();
  state.anomalySince = null;
  state.feedKeys = new Set();
  renderFeed();
  pollAnomalies();
}

// ── pollers: one request in flight each, never overlapping ────────────
function every(ms, fn) {
  let busy = false;
  const tick = async () => { if (busy) return; busy = true; try { await fn(); } finally { busy = false; } };
  tick(); setInterval(tick, ms);
}

buildTiles();
buildSeg("bucket-seg", BUCKETS, () => state.bucket, v => { state.bucket = v; localSet("bucket", v); loadChart(); });
buildSeg("window-seg", WINDOWS, () => state.windowMin, v => { state.windowMin = v; localSet("window", v); loadChart(); pollSummary(); resetAnomalies(); });
buildSeg("scope-seg", [["ticker", "Selected"], ["all", "All"]], () => state.feedScope, v => { state.feedScope = v; localSet("scope", v); renderFeed(); });
loadChart().then(() => every(1000, pollChart));
every(2000, pollAnomalies);
every(2000, pollSummary);
</script>
</body>
</html>
